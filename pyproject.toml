[project]
name = "apifyagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "apify-client>=3.0.4",
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "openai>=2.44.0",
    "openai-agents>=0.17.7",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-json-logger>=4.1.0",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
